		<radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
			<stop stop-color="#ffffff" stop-opacity="0.55" />
			<stop offset="1" stop-color="#ffffff" stop-opacity="0" />
		</radialGradient>
	</defs>
	<rect x="2" y="2" width="60" height="60" rx="16" fill="url(#g)" />
